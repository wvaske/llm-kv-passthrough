  # KV-size sweep (70 / 30 / 13 / 3-4 KB per token). Same compute shape for all (8B-class, so the emulated GPU
  # timing is identical); ONLY the KV bytes per token differ: 61 layers x MLA latent x dtype. 70 KiB = DeepSeek V3.2 BF16 geometry,
  # 30 KiB ~ V3.2 latent in FP8 at fewer layers (MLA + FP8), 13 KiB ~ compressed/sparse attention, 3-4 KiB = DeepSeek V4 class.
  # max_seq_len 1M for all (2026-10-21): AgentX sub-agent turns reach ~666k tokens; 163840 rejected them -> 5-6 % failed requests.
  kvsize-70k: {name: KV-size sweep 70 KiB/token (DS V3.2 MLA BF16 geometry), layers: 61, hidden: 7168, kv_heads: 1, num_heads: 128, head_dim_override: 192, kv_latent_dim: 576, intermediate: 18432, vocab_size: 129280, max_seq_len: 1048576, params_billions_override: 8}
