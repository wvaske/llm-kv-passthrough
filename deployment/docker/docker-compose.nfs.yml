version: '3.8'

# LMCache Deployment with NFS Shared Storage
# Use this configuration to characterize NFS I/O patterns for KV cache workloads
#
# Prerequisites:
# - NFS server accessible at the specified address
# - NFS export configured and accessible

services:
  # ===========================================
  # LMCache Server with NFS Storage
  # ===========================================
  lmcache-server:
    image: kvbench:latest
    container_name: lmcache-nfs
    ports:
      - "8000:8000"
      - "9090:9090"
    volumes:
      # Mount NFS share for shared KV cache storage
      - type: volume
        source: nfs_cache
        target: /data/nfs
        volume:
          nocopy: true
      # Local cache for Tier 2
      - local_cache:/data/local
    environment:
      # Instance configuration
      KVBENCH_INSTANCE_ID: lmcache-nfs-01

      # Server settings
      KVBENCH_SERVER__HOST: "0.0.0.0"
      KVBENCH_SERVER__PORT: "8000"
      KVBENCH_SERVER__MODEL_PROFILE: "llama-3.1-8b"
      KVBENCH_SERVER__SERVER_TYPE: "combined"

      # GPU emulation
      KVBENCH_GPU__GPU_PROFILE: "H100_SXM"
      KVBENCH_GPU__EFFICIENCY_FACTOR: "0.7"

      # Tier 1: CPU Memory (Hot cache)
      KVBENCH_RESOURCES__CPU_MEMORY_GB: "32"
      KVBENCH_RESOURCES__MEMORY_ALLOCATION: "eager"

      # Tier 3: NFS Storage (Shared cache)
      KVBENCH_STORAGE__BACKEND_TYPE: "nfs"
      KVBENCH_STORAGE__FILESYSTEM_PATH: "/data/nfs"

      # LMCache connector configuration
      KVBENCH_CONNECTOR__CONNECTOR_TYPE: "lmcache"
      KVBENCH_CONNECTOR__LMCACHE_CHUNK_SIZE: "256"
      KVBENCH_CONNECTOR__LMCACHE_MODEL_NAME: "llama-3.1-8b"

      # Metrics
      KVBENCH_METRICS__ENABLED: "true"
      KVBENCH_METRICS__PROMETHEUS_PORT: "9090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 40G
        reservations:
          memory: 32G

volumes:
  # NFS volume - configure with your NFS server details
  nfs_cache:
    driver: local
    driver_opts:
      type: nfs
      # Replace with your NFS server address and export path
      o: "addr=nfs-server.example.com,rw,sync,hard,intr,rsize=1048576,wsize=1048576"
      device: ":/exports/kvbench"

  # Local cache volume
  local_cache:
    driver: local
