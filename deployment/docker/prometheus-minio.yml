# Prometheus Configuration for MinIO Storage Deployment
# Use with docker-compose.minio.yml (--profile monitoring)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ===========================================
  # LMCache Server Metrics
  # ===========================================
  - job_name: 'lmcache-server'
    static_configs:
      - targets:
          - 'lmcache-minio:9090'
    metrics_path: /metrics
    scrape_interval: 10s

  # ===========================================
  # MinIO Metrics
  # ===========================================
  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
      - targets:
          - 'minio:9000'

  # ===========================================
  # Prometheus Self-Monitoring
  # ===========================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
