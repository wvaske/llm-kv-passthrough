version: '3.8'

# LMCache Deployment with MinIO S3-Compatible Storage
# Use this configuration to characterize S3/object storage I/O patterns
#
# Includes:
# - MinIO server (single node for testing)
# - LMCache server with S3 backend
# - Optional monitoring stack

services:
  # ===========================================
  # MinIO Object Storage
  # ===========================================
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ===========================================
  # MinIO Setup (Create Bucket)
  # ===========================================
  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb local/kvbench-cache --ignore-existing;
      mc anonymous set download local/kvbench-cache;
      echo 'MinIO bucket created successfully';
      exit 0;
      "

  # ===========================================
  # LMCache Server with MinIO Storage
  # ===========================================
  lmcache-server:
    image: kvbench:latest
    container_name: lmcache-minio
    ports:
      - "8000:8000"
      - "9090:9090"
    volumes:
      - local_cache:/data/local
    environment:
      # Instance configuration
      KVBENCH_INSTANCE_ID: lmcache-minio-01

      # Server settings
      KVBENCH_SERVER__HOST: "0.0.0.0"
      KVBENCH_SERVER__PORT: "8000"
      KVBENCH_SERVER__MODEL_PROFILE: "llama-3.1-8b"
      KVBENCH_SERVER__SERVER_TYPE: "combined"

      # GPU emulation
      KVBENCH_GPU__GPU_PROFILE: "H100_SXM"
      KVBENCH_GPU__EFFICIENCY_FACTOR: "0.7"

      # Tier 1: CPU Memory (Hot cache)
      KVBENCH_RESOURCES__CPU_MEMORY_GB: "32"
      KVBENCH_RESOURCES__MEMORY_ALLOCATION: "eager"

      # Tier 3: MinIO/S3 Storage (Shared cache)
      KVBENCH_STORAGE__BACKEND_TYPE: "s3"
      KVBENCH_STORAGE__S3_ENDPOINT: "http://minio:9000"
      KVBENCH_STORAGE__S3_BUCKET: "kvbench-cache"
      KVBENCH_STORAGE__S3_PREFIX: "lmcache/"
      KVBENCH_STORAGE__S3_ACCESS_KEY: "minioadmin"
      KVBENCH_STORAGE__S3_SECRET_KEY: "minioadmin123"
      KVBENCH_STORAGE__S3_REGION: "us-east-1"

      # AWS SDK configuration
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_DEFAULT_REGION: us-east-1

      # LMCache connector configuration
      KVBENCH_CONNECTOR__CONNECTOR_TYPE: "lmcache"
      KVBENCH_CONNECTOR__LMCACHE_CHUNK_SIZE: "256"
      KVBENCH_CONNECTOR__LMCACHE_MODEL_NAME: "llama-3.1-8b"

      # Metrics
      KVBENCH_METRICS__ENABLED: "true"
      KVBENCH_METRICS__PROMETHEUS_PORT: "9090"
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 40G
        reservations:
          memory: 32G

  # ===========================================
  # Prometheus (Optional Monitoring)
  # ===========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus-minio.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    profiles:
      - monitoring

  # ===========================================
  # Grafana (Optional Monitoring)
  # ===========================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  minio_data:
  local_cache:
  prometheus_data:
  grafana_data:
