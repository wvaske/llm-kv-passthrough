version: '3.8'

# LMCache Distributed Deployment
# Multi-worker setup with shared Redis storage for KV cache coordination

services:
  # ===========================================
  # Shared Storage: Redis Cluster
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: lmcache-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 16gb
      --maxmemory-policy allkeys-lru
      --io-threads 4
      --io-threads-do-reads yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - lmcache-network

  # ===========================================
  # LMCache Worker 0 (Prefill Primary)
  # ===========================================
  lmcache-worker-0:
    image: kvbench:latest
    container_name: lmcache-worker-0
    ports:
      - "8000:8000"
      - "9090:9090"
    volumes:
      - worker0_cache:/data/cache
    environment:
      KVBENCH_INSTANCE_ID: lmcache-worker-0
      KVBENCH_SERVER__HOST: "0.0.0.0"
      KVBENCH_SERVER__PORT: "8000"
      KVBENCH_SERVER__MODEL_PROFILE: "llama-3.1-70b"
      KVBENCH_SERVER__SERVER_TYPE: "prefill"
      KVBENCH_GPU__GPU_PROFILE: "H100_SXM"
      KVBENCH_GPU__TP_SIZE: "4"
      KVBENCH_RESOURCES__CPU_MEMORY_GB: "64"
      KVBENCH_RESOURCES__MEMORY_ALLOCATION: "eager"
      KVBENCH_STORAGE__BACKEND_TYPE: "redis"
      KVBENCH_STORAGE__REDIS_URL: "redis://redis:6379"
      KVBENCH_STORAGE__REDIS_PREFIX: "lmcache"
      KVBENCH_CONNECTOR__CONNECTOR_TYPE: "lmcache"
      KVBENCH_CONNECTOR__LMCACHE_CHUNK_SIZE: "256"
      KVBENCH_CONNECTOR__LMCACHE_MODEL_NAME: "llama-3.1-70b"
      KVBENCH_CONNECTOR__LMCACHE_WORLD_SIZE: "4"
      KVBENCH_CONNECTOR__LMCACHE_WORKER_ID: "0"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - lmcache-network
    deploy:
      resources:
        limits:
          memory: 80G

  # ===========================================
  # LMCache Worker 1 (Prefill Secondary)
  # ===========================================
  lmcache-worker-1:
    image: kvbench:latest
    container_name: lmcache-worker-1
    ports:
      - "8001:8000"
      - "9091:9090"
    volumes:
      - worker1_cache:/data/cache
    environment:
      KVBENCH_INSTANCE_ID: lmcache-worker-1
      KVBENCH_SERVER__HOST: "0.0.0.0"
      KVBENCH_SERVER__PORT: "8000"
      KVBENCH_SERVER__MODEL_PROFILE: "llama-3.1-70b"
      KVBENCH_SERVER__SERVER_TYPE: "prefill"
      KVBENCH_GPU__GPU_PROFILE: "H100_SXM"
      KVBENCH_GPU__TP_SIZE: "4"
      KVBENCH_RESOURCES__CPU_MEMORY_GB: "64"
      KVBENCH_RESOURCES__MEMORY_ALLOCATION: "eager"
      KVBENCH_STORAGE__BACKEND_TYPE: "redis"
      KVBENCH_STORAGE__REDIS_URL: "redis://redis:6379"
      KVBENCH_STORAGE__REDIS_PREFIX: "lmcache"
      KVBENCH_CONNECTOR__CONNECTOR_TYPE: "lmcache"
      KVBENCH_CONNECTOR__LMCACHE_CHUNK_SIZE: "256"
      KVBENCH_CONNECTOR__LMCACHE_MODEL_NAME: "llama-3.1-70b"
      KVBENCH_CONNECTOR__LMCACHE_WORLD_SIZE: "4"
      KVBENCH_CONNECTOR__LMCACHE_WORKER_ID: "1"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - lmcache-network
    deploy:
      resources:
        limits:
          memory: 80G

  # ===========================================
  # LMCache Worker 2 (Decode Primary)
  # ===========================================
  lmcache-worker-2:
    image: kvbench:latest
    container_name: lmcache-worker-2
    ports:
      - "8002:8000"
      - "9092:9090"
    volumes:
      - worker2_cache:/data/cache
    environment:
      KVBENCH_INSTANCE_ID: lmcache-worker-2
      KVBENCH_SERVER__HOST: "0.0.0.0"
      KVBENCH_SERVER__PORT: "8000"
      KVBENCH_SERVER__MODEL_PROFILE: "llama-3.1-70b"
      KVBENCH_SERVER__SERVER_TYPE: "decode"
      KVBENCH_GPU__GPU_PROFILE: "H100_SXM"
      KVBENCH_GPU__TP_SIZE: "4"
      KVBENCH_RESOURCES__CPU_MEMORY_GB: "64"
      KVBENCH_RESOURCES__MEMORY_ALLOCATION: "eager"
      KVBENCH_STORAGE__BACKEND_TYPE: "redis"
      KVBENCH_STORAGE__REDIS_URL: "redis://redis:6379"
      KVBENCH_STORAGE__REDIS_PREFIX: "lmcache"
      KVBENCH_CONNECTOR__CONNECTOR_TYPE: "lmcache"
      KVBENCH_CONNECTOR__LMCACHE_CHUNK_SIZE: "256"
      KVBENCH_CONNECTOR__LMCACHE_MODEL_NAME: "llama-3.1-70b"
      KVBENCH_CONNECTOR__LMCACHE_WORLD_SIZE: "4"
      KVBENCH_CONNECTOR__LMCACHE_WORKER_ID: "2"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - lmcache-network
    deploy:
      resources:
        limits:
          memory: 80G

  # ===========================================
  # LMCache Worker 3 (Decode Secondary)
  # ===========================================
  lmcache-worker-3:
    image: kvbench:latest
    container_name: lmcache-worker-3
    ports:
      - "8003:8000"
      - "9093:9090"
    volumes:
      - worker3_cache:/data/cache
    environment:
      KVBENCH_INSTANCE_ID: lmcache-worker-3
      KVBENCH_SERVER__HOST: "0.0.0.0"
      KVBENCH_SERVER__PORT: "8000"
      KVBENCH_SERVER__MODEL_PROFILE: "llama-3.1-70b"
      KVBENCH_SERVER__SERVER_TYPE: "decode"
      KVBENCH_GPU__GPU_PROFILE: "H100_SXM"
      KVBENCH_GPU__TP_SIZE: "4"
      KVBENCH_RESOURCES__CPU_MEMORY_GB: "64"
      KVBENCH_RESOURCES__MEMORY_ALLOCATION: "eager"
      KVBENCH_STORAGE__BACKEND_TYPE: "redis"
      KVBENCH_STORAGE__REDIS_URL: "redis://redis:6379"
      KVBENCH_STORAGE__REDIS_PREFIX: "lmcache"
      KVBENCH_CONNECTOR__CONNECTOR_TYPE: "lmcache"
      KVBENCH_CONNECTOR__LMCACHE_CHUNK_SIZE: "256"
      KVBENCH_CONNECTOR__LMCACHE_MODEL_NAME: "llama-3.1-70b"
      KVBENCH_CONNECTOR__LMCACHE_WORLD_SIZE: "4"
      KVBENCH_CONNECTOR__LMCACHE_WORKER_ID: "3"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - lmcache-network
    deploy:
      resources:
        limits:
          memory: 80G

  # ===========================================
  # Load Balancer / Proxy
  # ===========================================
  proxy:
    image: kvbench:latest
    container_name: lmcache-proxy
    ports:
      - "80:8000"
      - "9094:9090"
    environment:
      KVBENCH_INSTANCE_ID: lmcache-proxy
      KVBENCH_SERVER__HOST: "0.0.0.0"
      KVBENCH_SERVER__PORT: "8000"
      KVBENCH_SERVER__MODEL_PROFILE: "llama-3.1-70b"
      KVBENCH_SERVER__SERVER_TYPE: "proxy"
      KVBENCH_DISTRIBUTED__PREFILL_ENDPOINTS: "http://lmcache-worker-0:8000,http://lmcache-worker-1:8000"
      KVBENCH_DISTRIBUTED__DECODE_ENDPOINTS: "http://lmcache-worker-2:8000,http://lmcache-worker-3:8000"
      KVBENCH_DISTRIBUTED__HEALTH_CHECK_INTERVAL: "10"
      KVBENCH_DISTRIBUTED__LOAD_BALANCE_STRATEGY: "least_connections"
    depends_on:
      - lmcache-worker-0
      - lmcache-worker-1
      - lmcache-worker-2
      - lmcache-worker-3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - lmcache-network

volumes:
  redis_data:
  worker0_cache:
  worker1_cache:
  worker2_cache:
  worker3_cache:

networks:
  lmcache-network:
    driver: bridge
