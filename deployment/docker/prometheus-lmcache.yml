# Prometheus Configuration for LMCache Monitoring
# Use with docker-compose.lmcache.yml (--profile monitoring)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ===========================================
  # LMCache Server Metrics
  # ===========================================
  - job_name: 'lmcache-server'
    static_configs:
      - targets:
          - 'lmcache-server:9090'
    metrics_path: /metrics
    scrape_interval: 10s

  # ===========================================
  # LMCache Workers (Distributed Setup)
  # ===========================================
  - job_name: 'lmcache-workers'
    static_configs:
      - targets:
          - 'lmcache-worker-0:9090'
          - 'lmcache-worker-1:9090'
          - 'lmcache-worker-2:9090'
          - 'lmcache-worker-3:9090'
    metrics_path: /metrics
    scrape_interval: 10s

  # ===========================================
  # LMCache Proxy
  # ===========================================
  - job_name: 'lmcache-proxy'
    static_configs:
      - targets:
          - 'lmcache-proxy:9090'
    metrics_path: /metrics
    scrape_interval: 10s

  # ===========================================
  # Redis Metrics (via redis_exporter)
  # ===========================================
  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis-exporter:9121'
    scrape_interval: 15s

  # ===========================================
  # Prometheus Self-Monitoring
  # ===========================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
