# Telegraf native agent drop-in. The sampler does the privileged, read-only
# NVMe calls; Telegraf tails every complete line with its original timestamp.
# The companion .influx snapshots are for inspection, not lossy polling.
[[inputs.tail]]
  files = ["/var/lib/kvbench-nvme/*.stream"]
  from_beginning = true
  watch_method = "inotify"
  data_format = "influx"
