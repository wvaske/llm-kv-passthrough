---
# LMCache Server Deployment Playbook
# Deploys KV-Bench with LMCache connector and multi-tier storage

- name: Deploy LMCache Server
  hosts: lmcache_servers
  become: yes
  vars:
    # User/Group configuration
    kvbench_user: kvbench
    kvbench_group: kvbench
    kvbench_home: /opt/kvbench
    kvbench_config_dir: /etc/kvbench
    kvbench_log_dir: /var/log/kvbench
    kvbench_data_dir: /var/lib/kvbench

    # Default LMCache settings (can be overridden in inventory)
    kvbench_connector_type: lmcache
    kvbench_lmcache_chunk_size: 256
    kvbench_cpu_memory_gb: 64.0
    kvbench_memory_allocation: eager
    kvbench_nvme_storage_gb: 500.0
    kvbench_nvme_path: /var/lib/kvbench/nvme

    # Storage tier defaults
    lmcache_enable_local_disk: true
    lmcache_enable_remote_storage: true
    lmcache_local_disk_path: /var/lib/kvbench/cache
    lmcache_local_disk_max_gb: 500.0

  tasks:
    # ===========================================
    # System Dependencies
    # ===========================================
    - name: Install system dependencies (Debian/Ubuntu)
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - curl
          - nvme-cli
          - redis-tools
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install system dependencies (RHEL/CentOS)
      yum:
        name:
          - python3
          - python3-pip
          - curl
          - nvme-cli
          - redis
        state: present
      when: ansible_os_family == "RedHat"

    # ===========================================
    # User and Directory Setup
    # ===========================================
    - name: Create kvbench group
      group:
        name: "{{ kvbench_group }}"
        state: present

    - name: Create kvbench user
      user:
        name: "{{ kvbench_user }}"
        group: "{{ kvbench_group }}"
        home: "{{ kvbench_home }}"
        shell: /bin/bash
        system: yes
        create_home: yes

    - name: Create required directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ kvbench_user }}"
        group: "{{ kvbench_group }}"
        mode: '0755'
      loop:
        - "{{ kvbench_home }}"
        - "{{ kvbench_config_dir }}"
        - "{{ kvbench_log_dir }}"
        - "{{ kvbench_data_dir }}"
        - "{{ kvbench_nvme_path }}"

    # ===========================================
    # NVMe Storage Setup (Tier 2)
    # ===========================================
    - name: Check for NVMe devices
      shell: nvme list 2>/dev/null | grep -c '/dev/nvme' || echo "0"
      register: nvme_device_count
      changed_when: false
      when: lmcache_enable_local_disk | bool

    - name: Display NVMe device info
      debug:
        msg: "Found {{ nvme_device_count.stdout }} NVMe device(s)"
      when: lmcache_enable_local_disk | bool

    - name: Create local disk cache directory
      file:
        path: "{{ lmcache_local_disk_path }}"
        state: directory
        owner: "{{ kvbench_user }}"
        group: "{{ kvbench_group }}"
        mode: '0755'
      when: lmcache_enable_local_disk | bool

    - name: Mount NVMe device (if specified)
      mount:
        path: "{{ kvbench_nvme_path }}"
        src: "{{ lmcache_nvme_device }}"
        fstype: ext4
        opts: defaults,noatime
        state: mounted
      when:
        - lmcache_enable_local_disk | bool
        - lmcache_nvme_device is defined

    # ===========================================
    # Remote Storage Setup (Tier 3)
    # ===========================================
    - name: Test Redis connectivity
      shell: |
        redis-cli -u {{ redis_url | default('redis://localhost:6379') }} ping
      register: redis_ping
      changed_when: false
      ignore_errors: yes
      when:
        - lmcache_enable_remote_storage | bool
        - kvbench_storage | default('redis') == 'redis'

    - name: Display Redis connectivity status
      debug:
        msg: "Redis connectivity: {{ 'OK' if redis_ping.stdout == 'PONG' else 'FAILED' }}"
      when:
        - lmcache_enable_remote_storage | bool
        - kvbench_storage | default('redis') == 'redis'

    - name: Mount NFS share (if using NFS storage)
      mount:
        path: "{{ kvbench_filesystem_path }}"
        src: "{{ lmcache_nfs_server }}:{{ lmcache_nfs_export }}"
        fstype: nfs
        opts: "defaults,_netdev,{{ lmcache_nfs_options | default('') }}"
        state: mounted
      when:
        - lmcache_enable_remote_storage | bool
        - kvbench_storage | default('redis') == 'nfs'
        - lmcache_nfs_server is defined

    # ===========================================
    # Python Environment
    # ===========================================
    - name: Create Python virtual environment
      command: python3 -m venv {{ kvbench_home }}/venv
      args:
        creates: "{{ kvbench_home }}/venv/bin/python"
      become_user: "{{ kvbench_user }}"

    - name: Upgrade pip in virtual environment
      pip:
        name: pip
        state: latest
        virtualenv: "{{ kvbench_home }}/venv"
      become_user: "{{ kvbench_user }}"

    - name: Install kvbench package
      pip:
        name: kvbench
        state: "{{ 'latest' if kvbench_version | default('latest') == 'latest' else 'present' }}"
        version: "{{ omit if kvbench_version | default('latest') == 'latest' else kvbench_version }}"
        virtualenv: "{{ kvbench_home }}/venv"
      become_user: "{{ kvbench_user }}"

    # ===========================================
    # Configuration
    # ===========================================
    - name: Deploy LMCache configuration file
      template:
        src: ../templates/lmcache-config.yaml.j2
        dest: "{{ kvbench_config_dir }}/config.yaml"
        owner: "{{ kvbench_user }}"
        group: "{{ kvbench_group }}"
        mode: '0640'
      notify: Restart kvbench

    - name: Deploy systemd service for LMCache
      template:
        src: ../templates/lmcache.service.j2
        dest: /etc/systemd/system/kvbench.service
        mode: '0644'
      notify:
        - Reload systemd
        - Restart kvbench

    # ===========================================
    # Service Management
    # ===========================================
    - name: Enable and start kvbench service
      systemd:
        name: kvbench
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Wait for LMCache server to be ready
      uri:
        url: "http://localhost:{{ kvbench_port | default(8000) }}/health"
        method: GET
        status_code: 200
      register: health_check
      until: health_check.status == 200
      retries: 30
      delay: 2
      ignore_errors: yes

    - name: Verify cache connectivity
      uri:
        url: "http://localhost:{{ kvbench_port | default(8000) }}/metrics"
        method: GET
        status_code: 200
        return_content: yes
      register: metrics_response
      ignore_errors: yes

    - name: Display deployment status
      debug:
        msg: |
          LMCache Server Deployment Complete
          ==================================
          Host: {{ inventory_hostname }}
          Instance ID: {{ kvbench_instance_id | default(inventory_hostname) }}
          Server Status: {{ 'Running' if health_check.status == 200 else 'Not Ready' }}

          Storage Configuration:
          - CPU Memory: {{ kvbench_cpu_memory_gb }} GB
          - Local Disk: {{ lmcache_local_disk_path }} ({{ lmcache_local_disk_max_gb }} GB)
          - Remote Storage: {{ kvbench_storage | default('memory') }}

          LMCache Settings:
          - Chunk Size: {{ kvbench_lmcache_chunk_size }}
          - World Size: {{ kvbench_lmcache_world_size | default(1) }}
          - Worker ID: {{ kvbench_lmcache_worker_id | default(0) }}

          Endpoints:
          - API: http://{{ ansible_host | default(inventory_hostname) }}:{{ kvbench_port | default(8000) }}
          - Metrics: http://{{ ansible_host | default(inventory_hostname) }}:{{ kvbench_prometheus_port | default(9090) }}

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart kvbench
      systemd:
        name: kvbench
        state: restarted


# ===========================================
# Redis Deployment (Optional)
# ===========================================
- name: Deploy Redis for LMCache
  hosts: redis_servers
  become: yes
  vars:
    redis_port: 6379
    redis_maxmemory: "{{ (ansible_memtotal_mb * 0.8) | int }}mb"
    redis_maxmemory_policy: allkeys-lru

  tasks:
    - name: Install Redis
      apt:
        name: redis-server
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Configure Redis for LMCache
      template:
        src: ../templates/redis-lmcache.conf.j2
        dest: /etc/redis/redis.conf
        mode: '0644'
      notify: Restart redis

    - name: Enable and start Redis
      systemd:
        name: redis-server
        enabled: yes
        state: started

    - name: Verify Redis is running
      shell: redis-cli ping
      register: redis_status
      changed_when: false

    - name: Display Redis status
      debug:
        msg: "Redis status: {{ redis_status.stdout }}"

  handlers:
    - name: Restart redis
      systemd:
        name: redis-server
        state: restarted
  when: "'redis_servers' in groups and groups['redis_servers'] | length > 0"
