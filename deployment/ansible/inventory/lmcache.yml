---
# LMCache Server Deployment Inventory
# This inventory defines a distributed LMCache deployment with:
# - Redis for shared remote storage (Tier 3)
# - Local NVMe for warm cache (Tier 2)
# - CPU memory for hot cache (Tier 1)

all:
  vars:
    # ===========================================
    # Global KV-Bench Settings
    # ===========================================
    kvbench_version: "latest"
    kvbench_model: "llama-3.1-70b"
    kvbench_gpu: "H100_SXM"
    kvbench_tp_size: 4
    kvbench_efficiency: 0.7

    # ===========================================
    # LMCache Connector Settings
    # ===========================================
    kvbench_connector_type: lmcache
    kvbench_lmcache_chunk_size: 256
    kvbench_lmcache_model_name: "{{ kvbench_model }}"
    kvbench_lmcache_bytes_per_token: 512

    # ===========================================
    # Storage Configuration
    # ===========================================
    # Tier 3: Remote shared storage (Redis)
    kvbench_storage: redis
    redis_url: "redis://redis-01:6379"
    redis_cluster: false
    redis_prefix: "lmcache"
    redis_ttl: 3600
    redis_max_connections: 100

    # ===========================================
    # Resource Allocation
    # ===========================================
    # Tier 1: CPU Memory (Hot cache)
    kvbench_cpu_memory_gb: 64.0
    kvbench_memory_allocation: eager

    # Tier 2: Local NVMe (Warm cache)
    kvbench_nvme_storage_gb: 500.0
    kvbench_nvme_path: /var/lib/kvbench/nvme
    lmcache_enable_local_disk: true
    lmcache_local_disk_path: /var/lib/kvbench/cache
    lmcache_local_disk_max_gb: 500.0

    # ===========================================
    # Metrics & Monitoring
    # ===========================================
    kvbench_metrics_enabled: true
    kvbench_prometheus_port: 9090
    kvbench_include_histograms: true

  children:
    # ===========================================
    # Redis Servers (Tier 3 Storage)
    # ===========================================
    redis_servers:
      hosts:
        redis-01:
          ansible_host: 10.0.1.10
          redis_port: 6379
          redis_maxmemory: "32gb"
          redis_maxmemory_policy: "allkeys-lru"
          redis_persistence: true
          redis_aof: true

    # ===========================================
    # LMCache Servers (Combined Workers)
    # ===========================================
    lmcache_servers:
      children:
        prefill:
        decode:

    # ===========================================
    # Prefill Workers
    # ===========================================
    prefill:
      vars:
        kvbench_server_type: prefill
        # Prefill benefits from larger memory for prompt caching
        kvbench_cpu_memory_gb: 128.0

      hosts:
        prefill-01:
          ansible_host: 10.0.2.11
          kvbench_instance_id: lmcache-prefill-01
          kvbench_lmcache_worker_id: 0
          kvbench_lmcache_world_size: 4
          # Optional: Mount specific NVMe device
          # lmcache_nvme_device: /dev/nvme0n1

        prefill-02:
          ansible_host: 10.0.2.12
          kvbench_instance_id: lmcache-prefill-02
          kvbench_lmcache_worker_id: 1
          kvbench_lmcache_world_size: 4

    # ===========================================
    # Decode Workers
    # ===========================================
    decode:
      vars:
        kvbench_server_type: decode
        # Decode can use less memory, relies on shared cache
        kvbench_cpu_memory_gb: 64.0

      hosts:
        decode-01:
          ansible_host: 10.0.3.21
          kvbench_instance_id: lmcache-decode-01
          kvbench_lmcache_worker_id: 2
          kvbench_lmcache_world_size: 4

        decode-02:
          ansible_host: 10.0.3.22
          kvbench_instance_id: lmcache-decode-02
          kvbench_lmcache_worker_id: 3
          kvbench_lmcache_world_size: 4

    # ===========================================
    # Proxy / Load Balancer
    # ===========================================
    proxy:
      hosts:
        proxy-01:
          ansible_host: 10.0.4.30
          kvbench_instance_id: lmcache-proxy
          kvbench_server_type: proxy
          kvbench_load_balance_strategy: least_connections
          kvbench_health_check_interval: 10.0

    # ===========================================
    # All KV-Bench Servers (for common tasks)
    # ===========================================
    kvbench_servers:
      children:
        lmcache_servers:
        proxy:
