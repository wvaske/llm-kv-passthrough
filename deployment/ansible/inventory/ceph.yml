# KV-Bench Ansible Inventory - Ceph Storage
# Deployment using Ceph RADOS for distributed object storage
#
# This configuration is ideal for:
# - Large-scale distributed deployments
# - High availability requirements
# - Characterizing Ceph I/O patterns for KV cache workloads

all:
  vars:
    # ===========================================
    # Global KV-Bench Settings
    # ===========================================
    kvbench_version: "latest"
    kvbench_model: "llama-3.1-70b"
    kvbench_gpu: "H100_SXM"
    kvbench_efficiency: 0.7
    kvbench_tp_size: 4
    kvbench_log_level: "info"

    # ===========================================
    # Ceph Storage Configuration
    # ===========================================
    kvbench_storage: ceph
    kvbench_ceph_pool: kvbench-cache
    kvbench_ceph_conf_path: /etc/ceph/ceph.conf
    kvbench_ceph_keyring_path: /etc/ceph/ceph.client.kvbench.keyring
    kvbench_ceph_client_name: client.kvbench
    kvbench_ceph_namespace: lmcache

    # ===========================================
    # LMCache Connector Settings
    # ===========================================
    kvbench_connector_type: lmcache
    kvbench_lmcache_chunk_size: 256
    kvbench_lmcache_model_name: "{{ kvbench_model }}"

    # ===========================================
    # Resource Allocation
    # ===========================================
    kvbench_cpu_memory_gb: 128.0
    kvbench_memory_allocation: eager
    kvbench_nvme_storage_gb: 500.0
    kvbench_nvme_path: /var/lib/kvbench/nvme

    # Local disk as Tier 2 cache (before Ceph)
    lmcache_enable_local_disk: true
    lmcache_local_disk_path: /var/lib/kvbench/cache
    lmcache_local_disk_max_gb: 500.0

    # ===========================================
    # Metrics & Monitoring
    # ===========================================
    kvbench_metrics_enabled: true
    kvbench_prometheus_port: 9090

    # ===========================================
    # Ansible Connection Settings
    # ===========================================
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3

  children:
    # ===========================================
    # Ceph Monitors (for client configuration)
    # ===========================================
    ceph_monitors:
      hosts:
        ceph-mon-1:
          ansible_host: 10.0.0.50
        ceph-mon-2:
          ansible_host: 10.0.0.51
        ceph-mon-3:
          ansible_host: 10.0.0.52

    # ===========================================
    # Prefill Servers
    # ===========================================
    prefill:
      vars:
        kvbench_server_type: prefill
        kvbench_cpu_memory_gb: 128.0

      hosts:
        prefill-1:
          ansible_host: 10.0.1.11
          kvbench_instance_id: ceph-prefill-01
          kvbench_lmcache_worker_id: 0
          kvbench_lmcache_world_size: 4

        prefill-2:
          ansible_host: 10.0.1.12
          kvbench_instance_id: ceph-prefill-02
          kvbench_lmcache_worker_id: 1
          kvbench_lmcache_world_size: 4

    # ===========================================
    # Decode Servers
    # ===========================================
    decode:
      vars:
        kvbench_server_type: decode
        kvbench_cpu_memory_gb: 64.0

      hosts:
        decode-1:
          ansible_host: 10.0.2.21
          kvbench_instance_id: ceph-decode-01
          kvbench_lmcache_worker_id: 2
          kvbench_lmcache_world_size: 4

        decode-2:
          ansible_host: 10.0.2.22
          kvbench_instance_id: ceph-decode-02
          kvbench_lmcache_worker_id: 3
          kvbench_lmcache_world_size: 4

    # ===========================================
    # Proxy / Load Balancer
    # ===========================================
    proxy:
      hosts:
        proxy-1:
          ansible_host: 10.0.3.30
          kvbench_instance_id: ceph-proxy
          kvbench_server_type: proxy
          kvbench_load_balance_strategy: least_connections

    # ===========================================
    # Group All Servers
    # ===========================================
    kvbench_servers:
      children:
        prefill:
        decode:
        proxy:

    lmcache_servers:
      children:
        prefill:
        decode:
