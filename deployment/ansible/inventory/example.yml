# KV-Bench Ansible Inventory Example
# Copy this file and modify for your environment
#
# KV-Bench characterizes storage workload patterns for shared KV caches
# in LLM serving. All storage is owned by LMCache: the lmcache_* vars
# below render /etc/kvbench/lmcache.yaml (LMCache's own application
# config). This example shares an NFS mount across the fleet as
# LMCache's disk tier.

all:
  vars:
    # ===========================================
    # Global KV-Bench Settings
    # ===========================================
    # pip requirement to install (override with a wheel path or VCS ref)
    # kvbench_pip_spec: "kvbench[lmcache] @ git+https://github.com/wvaske/llm-kv-passthrough.git"
    kvbench_model: "llama-3.1-8b"
    kvbench_gpu: "H100_SXM"
    kvbench_efficiency: 0.7
    kvbench_log_level: "info"

    # ===========================================
    # LMCache Storage Configuration
    # (rendered into /etc/kvbench/lmcache.yaml — LMCache owns storage)
    # ===========================================
    lmcache_chunk_size: 256
    lmcache_max_local_cpu_size_gb: 4.0

    # Disk tier on a shared NFS mount: every node sees the same cache
    # namespace, so prefill-written KV is readable by decode nodes.
    lmcache_local_disk_path: "/mnt/nfs/kvcache"
    lmcache_max_local_disk_size_gb: 500.0

    # Or use a network store as the shared remote tier instead:
    # lmcache_remote_url: "redis://cache-host:6379"
    # lmcache_remote_url: "s3://kv-cache-bucket"
    # lmcache_remote_url: "fs:///mnt/nfs/kvcache/"

    # NFS mount options (used by deploy playbook)
    lmcache_nfs_server: "nfs-server.example.com"
    lmcache_nfs_export: "/exports/kvbench"
    lmcache_nfs_options: "rw,sync,hard,intr"

    # ===========================================
    # Metrics & Monitoring
    # ===========================================
    kvbench_metrics_enabled: true
    kvbench_prometheus_port: 9090
    kvbench_include_histograms: true

    # ===========================================
    # Ansible Connection Settings
    # ===========================================
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3

  children:
    # ===========================================
    # NFS Server (for storage workload testing)
    # ===========================================
    nfs_servers:
      hosts:
        nfs-1:
          ansible_host: 10.0.0.5

    # ===========================================
    # Prefill Servers (prompt processing)
    # ===========================================
    prefill:
      hosts:
        prefill-1:
          ansible_host: 10.0.0.11
          kvbench_instance_id: prefill-1
          kvbench_server_type: prefill
        prefill-2:
          ansible_host: 10.0.0.12
          kvbench_instance_id: prefill-2
          kvbench_server_type: prefill

    # ===========================================
    # Decode Servers (token generation)
    # ===========================================
    decode:
      hosts:
        decode-1:
          ansible_host: 10.0.0.21
          kvbench_instance_id: decode-1
          kvbench_server_type: decode
        decode-2:
          ansible_host: 10.0.0.22
          kvbench_instance_id: decode-2
          kvbench_server_type: decode

    # ===========================================
    # Proxy / Load Balancer
    # ===========================================
    proxy:
      hosts:
        proxy-1:
          ansible_host: 10.0.0.30
          kvbench_instance_id: proxy-1
          kvbench_server_type: proxy

    # ===========================================
    # Group All KV-Bench Servers
    # ===========================================
    kvbench_servers:
      children:
        prefill:
        decode:
        proxy:
