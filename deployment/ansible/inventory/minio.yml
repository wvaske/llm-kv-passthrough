# KV-Bench Ansible Inventory - MinIO/S3 Storage
# Deployment using MinIO for S3-compatible object storage
#
# This configuration is ideal for:
# - Cloud-native deployments
# - S3-compatible storage testing
# - Characterizing object storage I/O patterns for KV cache workloads

all:
  vars:
    # ===========================================
    # Global KV-Bench Settings
    # ===========================================
    kvbench_version: "latest"
    kvbench_model: "llama-3.1-70b"
    kvbench_gpu: "H100_SXM"
    kvbench_efficiency: 0.7
    kvbench_tp_size: 4
    kvbench_log_level: "info"

    # ===========================================
    # MinIO/S3 Storage Configuration
    # ===========================================
    kvbench_storage: s3
    kvbench_s3_endpoint: http://minio.example.com:9000
    kvbench_s3_bucket: kvbench-cache
    kvbench_s3_prefix: lmcache/
    kvbench_s3_region: us-east-1
    # Credentials should be stored in Ansible Vault
    # kvbench_s3_access_key: "{{ vault_minio_access_key }}"
    # kvbench_s3_secret_key: "{{ vault_minio_secret_key }}"

    # ===========================================
    # LMCache Connector Settings
    # ===========================================
    kvbench_connector_type: lmcache
    kvbench_lmcache_chunk_size: 256
    kvbench_lmcache_model_name: "{{ kvbench_model }}"

    # ===========================================
    # Resource Allocation
    # ===========================================
    kvbench_cpu_memory_gb: 128.0
    kvbench_memory_allocation: eager
    kvbench_nvme_storage_gb: 500.0
    kvbench_nvme_path: /var/lib/kvbench/nvme

    # Local disk as Tier 2 cache (before S3)
    lmcache_enable_local_disk: true
    lmcache_local_disk_path: /var/lib/kvbench/cache
    lmcache_local_disk_max_gb: 500.0

    # ===========================================
    # Metrics & Monitoring
    # ===========================================
    kvbench_metrics_enabled: true
    kvbench_prometheus_port: 9090

    # ===========================================
    # Ansible Connection Settings
    # ===========================================
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3

  children:
    # ===========================================
    # MinIO Servers (Distributed Mode)
    # ===========================================
    minio_servers:
      vars:
        minio_root_user: minioadmin
        minio_root_password: "{{ vault_minio_password }}"
        minio_data_dirs:
          - /data/minio1
          - /data/minio2

      hosts:
        minio-1:
          ansible_host: 10.0.0.40
        minio-2:
          ansible_host: 10.0.0.41
        minio-3:
          ansible_host: 10.0.0.42
        minio-4:
          ansible_host: 10.0.0.43

    # ===========================================
    # Prefill Servers
    # ===========================================
    prefill:
      vars:
        kvbench_server_type: prefill
        kvbench_cpu_memory_gb: 128.0

      hosts:
        prefill-1:
          ansible_host: 10.0.1.11
          kvbench_instance_id: minio-prefill-01
          kvbench_lmcache_worker_id: 0
          kvbench_lmcache_world_size: 4

        prefill-2:
          ansible_host: 10.0.1.12
          kvbench_instance_id: minio-prefill-02
          kvbench_lmcache_worker_id: 1
          kvbench_lmcache_world_size: 4

    # ===========================================
    # Decode Servers
    # ===========================================
    decode:
      vars:
        kvbench_server_type: decode
        kvbench_cpu_memory_gb: 64.0

      hosts:
        decode-1:
          ansible_host: 10.0.2.21
          kvbench_instance_id: minio-decode-01
          kvbench_lmcache_worker_id: 2
          kvbench_lmcache_world_size: 4

        decode-2:
          ansible_host: 10.0.2.22
          kvbench_instance_id: minio-decode-02
          kvbench_lmcache_worker_id: 3
          kvbench_lmcache_world_size: 4

    # ===========================================
    # Proxy / Load Balancer
    # ===========================================
    proxy:
      hosts:
        proxy-1:
          ansible_host: 10.0.3.30
          kvbench_instance_id: minio-proxy
          kvbench_server_type: proxy
          kvbench_load_balance_strategy: least_connections

    # ===========================================
    # Group All Servers
    # ===========================================
    kvbench_servers:
      children:
        prefill:
        decode:
        proxy:

    lmcache_servers:
      children:
        prefill:
        decode:
