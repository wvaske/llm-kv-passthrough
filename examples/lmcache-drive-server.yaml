server:
  model_profile: llama-3.1-8b
gpu:
  gpu_profile: B300_SXM
  tp_size: 8
timing:
  full_speed: true
scheduler:
  # Illustrative fast-system rates; full_speed removes compute sleeps for saturation.
  prefill_tokens_per_second: 200000
  decode_tokens_per_second: 20000
  prefill_chunk_tokens: 8192
  max_active_requests: 32
kv:
  active_ranks: [0]
  payload_generator: sfc64
  lmcache_config_file: lmcache-drive-endurance.yaml
  max_cpu_memory_gb: 2
